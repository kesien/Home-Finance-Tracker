services:
  app:
    build: .
    restart: unless-stopped
    environment:
      TZ: Europe/Budapest # a napi mentés „napja” a helyi idő szerint értendő
    ports:
      - "3000:3000"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
    volumes:
      - finance-data:/data
volumes:
  finance-data:
